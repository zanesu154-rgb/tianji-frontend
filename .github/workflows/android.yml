# 打包安卓 App（Capacitor 外壳，打开线上网站）
#
# - 推送 v 开头的标签（如 v1.0.0）：编译 → 签名 → 发布到 Release
# - 手动运行：只编译，安装包在本次运行的 Artifacts 里
#
# 签名需要的 4 个 Secrets 见 app/README.md
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 计算版本号
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.$GITHUB_RUN_NUMBER"
          fi
          IFS='.' read -r MA MI PA <<< "${VERSION%%-*}"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          [ "$CODE" -lt 1 ] && CODE=1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本 $VERSION（内部版本号 $CODE）"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成安卓工程
        run: npx cap add android

      - name: 图标与启动画面
        run: |
          ICON=$(tr -d '[:space:]' < ICON)
          echo "使用图标：$ICON"
          mkdir -p assets
          cp icons/$ICON/*.png assets/
          npm run icons

      - name: 写入版本号
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.ver.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 同步
        run: npx cap sync android

      - name: 编译
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::还没有配置签名 Secrets（ANDROID_KEYSTORE_BASE64 等），请按 app/README.md 配置后重新运行"
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="tianji-v${{ steps.ver.outputs.version }}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK=app/$OUT" >> "$GITHUB_ENV"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: tianji-apk-${{ steps.ver.outputs.version }}
          path: ${{ env.APK }}

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          name: 天际译栈 App ${{ github.ref_name }}
          body: |
            📱 天际译栈安卓 App ${{ github.ref_name }}

            下载下面的 `tianji-${{ github.ref_name }}.apk` 安装即可（第一次安装需要允许「安装未知来源应用」）。
            App 打开的是线上网站，网站内容更新不需要重新下载 App。
