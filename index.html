            let announcementList = [];
            let announcementIndex = 0;
            let announcementTimer = null;

            async function fetchAnnouncement() {
                try {
                    const res = await fetch(`${API_BASE}/settings/announcement`);
                    const data = await res.json();
                    // 按换行拆分，过滤空行
                    const raw = (data.value || '欢迎来到天际译栈！').toString();
                    announcementList = raw.split(/\n/).map(s => s.trim()).filter(s => s.length > 0);
                    if (announcementList.length === 0) {
                        announcementList = ['欢迎来到天际译栈！'];
                    }
                } catch (e) {
                    announcementList = ['欢迎来到天际译栈！'];
                }
                renderAnnouncement();
                startAnnouncementRotate();
            }

            function renderAnnouncement() {
                const track = document.getElementById('announcementTrack');
                if (!track) return;

                // 如果只有 1 条，不需要复制
                const list = announcementList.length > 1
                    ? [...announcementList, announcementList[0]]   // ← 末尾复制第一条
                    : [...announcementList];

                track.innerHTML = list
                    .map(text => `<div class="announcement-text"><span>${escapeHtml(text)}</span></div>`)
                    .join('');

                announcementIndex = 0;
                track.style.transition = 'none';
                track.style.transform = 'translateY(0)';
                void track.offsetHeight;
                track.style.transition = '';

                // 渲染完后检测超长
                requestAnimationFrame(() => {
                    checkAnnouncementOverflow();
                });
            }

            function checkAnnouncementOverflow() {
                const viewport = document.getElementById('announcementViewport');
                const items = document.querySelectorAll('#announcementTrack .announcement-text');
                if (!viewport || !items.length) return;

                const viewportWidth = viewport.clientWidth;

                items.forEach(el => {
                    const span = el.querySelector('span');
                    if (!span) return;

                    // 先重置滚动状态
                    el.classList.remove('scrolling');
                    span.textContent = span.textContent; // 保持内容

                    // 量一下实际文字宽度
                    const textWidth = span.scrollWidth;

                    if (textWidth > viewportWidth) {
                        // 超长：复制一份内容，实现无缝滚动
                        const original = span.textContent;
                        span.textContent = original + '\u00A0\u00A0\u00A0\u00A0' + original;
                        el.classList.add('scrolling');
                    }
                });
            }

            function startAnnouncementRotate() {
                if (announcementTimer) clearInterval(announcementTimer);
                if (announcementList.length <= 1) return;

                announcementTimer = setInterval(() => {
                    const track = document.getElementById('announcementTrack');
                    if (!track) return;

                    const items = track.querySelectorAll('.announcement-text');
                    if (!items.length) return;

                    const lineHeight = items[0].offsetHeight || 21;
                    announcementIndex++;

                    // 滚到刚复制出的"假的第一条"
                    track.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    track.style.transform = `translateY(-${announcementIndex * lineHeight}px)`;

                    // 到达假第一条后，无动画重置回真第一条
                    if (announcementIndex >= announcementList.length) {
                        setTimeout(() => {
                            track.style.transition = 'none';
                            track.style.transform = 'translateY(0)';
                            announcementIndex = 0;
                            void track.offsetHeight;   // 强制 reflow
                        }, 620);   // 等滚动动画结束（600ms + 一点余量）
                    }
                }, 4000);   // 每条显示 4 秒
            }

            async function saveAnnouncement(value) {
                const res = await fetch(`${API_BASE}/settings/announcement`, {
                    method: 'PUT',
                    headers: authHeaders(),
                    body: JSON.stringify({ value })
                });
                if (!res.ok) throw new Error('保存失败');
                return res.json();
            }

            // ==================== 渲染 ====================
            function filterItems(list) {
                if (!searchQuery) return list;
                const q = searchQuery.toLowerCase();
                return list.filter(item => {
                    const orig = (item.original || '').toLowerCase();
                    const trans = (item.translated || '').toLowerCase();
                    const author = (item.author || '').toLowerCase();
                    const desc = (item.description || '').toLowerCase();
                    return orig.includes(q) || trans.includes(q) || author.includes(q) || desc.includes(q);
                });
            }

            function render() {
                const allPending = items.filter(i => i.status !== STATUS.DONE);
                const doing = allPending.filter(i => i.status === STATUS.DOING);
                const todo = allPending.filter(i => i.status !== STATUS.DOING);
                const sortedPending = [...doing, ...todo];

                const allDone = items.filter(i => i.status === STATUS.DONE);

                const filteredPending = filterItems(sortedPending);
                const filteredDone = filterItems(allDone);

                document.getElementById('pendingCount').textContent = allPending.length;
                document.getElementById('doneCount').textContent = allDone.length;

                // 访客看不到待汉化模块
                document.getElementById('pendingModule').style.display = isAdmin ? '' : 'none';

                renderList('pendingList', filteredPending, false);
                renderList('doneList', filteredDone, true);

                updateModuleStyles();
            }

            function updateModuleStyles() {
                const pendingModule = document.getElementById('pendingModule');
                const doneModule = document.getElementById('doneModule');
                const pendingToggle = document.getElementById('pendingToggle');
                const doneToggle = document.getElementById('doneToggle');

                // 处理待汉化模块
                handleModuleToggle(pendingModule, pendingToggle, moduleExpanded.pending);
                // 处理已汉化模块
                handleModuleToggle(doneModule, doneToggle, moduleExpanded.done);
            }

            function handleModuleToggle(moduleEl, toggleBtn, expanded) {
                const bodyEl = moduleEl.querySelector('.module-body');
                if (!bodyEl) return;

                if (expanded) {
                    // 展开
                    moduleEl.classList.add('module-expanded');
                    toggleBtn.textContent = '▲';
                    // 先量一下真实高度，赋给它作为动画终点
                    const targetHeight = bodyEl.scrollHeight;
                    bodyEl.style.maxHeight = targetHeight + 'px';
                    // 动画结束后让它自适应
                    clearTimeout(bodyEl._expandTimer);
                    bodyEl._expandTimer = setTimeout(() => {
                        if (moduleEl.classList.contains('module-expanded')) {
                            bodyEl.style.maxHeight = 'none';
                        }
                    }, 370);
                } else {
                    // 收起
                    // 如果当前是 none，先恢复成具体高度才能过渡
                    if (bodyEl.style.maxHeight === 'none') {
                        bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
                        void bodyEl.offsetHeight;
                    }
                    moduleEl.classList.remove('module-expanded');
                    toggleBtn.textContent = '▼';
                    // 移除 inline style，让 CSS 的 260px 生效
                    bodyEl.style.maxHeight = '';
                }
            }

            function renderList(containerId, list, isDoneSection) {
                const container = document.getElementById(containerId);
                if (!list.length) {
                    let msg = searchQuery ? '没有匹配的搜索结果' : (isDoneSection ? '暂无已汉化项目' : '还没有项目');
                    container.innerHTML = `<div class="empty-msg">${msg}</div>`;
                    return;
                }

                let html = '';
                list.forEach(item => {
                    const orig = item.original || '未知';
                    const trans = item.translated || '';
                    const authorDisplay = item.author || '佚名';
                    const status = item.status || STATUS.TODO;
                    const isDone = status === STATUS.DONE;
                    const isDoing = status === STATUS.DOING;
                    const expanded = item.expanded ? 'show' : '';

                    let nameHtml = '';
                    if (isDone && trans) {
                        nameHtml = `<span class="orig">${escapeHtml(orig)}</span> <span class="trans">(${escapeHtml(trans)})</span>`;
                    } else if (isDone && !trans) {
                        nameHtml = `<span class="orig">${escapeHtml(orig)}</span> <span class="trans">(未填写中译名)</span>`;
                    } else {
                        nameHtml = `<span class="orig">${escapeHtml(orig)}</span>`;
                    }

                    let iconClass = '';
                    let iconContent = '';
                    if (isDone) {
                        iconClass = 'done';
                        iconContent = '✅';
                    } else if (isDoing) {
                        iconClass = 'in-progress';
                        iconContent = '⏳';
                    } else {
                        iconClass = '';
                        iconContent = '□';
                    }


                    html += `
                    <div class="item" data-id="${item.id}">
                        <div class="item-top">
                            ${isAdmin ? `<span class="drag-handle" draggable="true" data-id="${item.id}" title="拖动排序">⋮⋮</span>` : ''}
                            ${!isDone ? `<span class="status-icon ${iconClass}" data-action="cycle-status" data-id="${item.id}" title="点击切换状态">${iconContent}</span>` : ''}
                            <div class="item-name">${nameHtml}</div>
                        </div>
                        <div class="item-bottom">
                            <span class="author-name">${escapeHtml(authorDisplay)}</span>
                            ${isAdmin ? `<button class="edit-icon-btn" data-action="edit-item" data-id="${item.id}" title="编辑">✏️</button>` : ''}
                            <button class="expand-btn" data-action="expand" data-id="${item.id}">${item.expanded ? '▲' : '▼'}</button>
                        </div>
                        <div class="item-details" data-details-id="${item.id}"></div>
                    </div>
                `;
                });
                container.innerHTML = html;
            }

            function buildDetailsHtml(item) {
                const isDone = item.status === STATUS.DONE;
                let detailsHtml = '';

                if (item.description) {
                    detailsHtml += `<div class="item-description">${escapeHtml(item.description)}</div>`;
                }

                const linkFields = isDone
                    ? [
                        { label: '作者直链', field: 'authorLink' },
                        { label: '汉化链接', field: 'translationLink' },
                        { label: '原版链接', field: 'originalLink' }
                    ]
                    : [{ label: '原版链接', field: 'originalLink' }];

                linkFields.forEach(({ label, field }) => {
                    const val = item[field] || '';
                    const readonlyHtml = isAdmin
                        ? `<input type="text" class="detail-input" data-field="${field}" data-id="${item.id}" value="${escapeHtml(val)}" placeholder="https://...">`
                        : `<div class="detail-readonly">${val ? escapeHtml(val) : '<span style="color:var(--text-light);">未填写</span>'}</div>`;
                    detailsHtml += `
            <div class="detail-row">
                <span class="detail-label">${label}</span>
                ${readonlyHtml}
                <div class="btn-group">
                    <button class="copy-btn" data-copy="${field}" data-id="${item.id}">📋 复制</button>
                    <a class="open-btn" href="javascript:void(0)" data-action="open-link" data-id="${item.id}" data-field="${field}">🔗 跳转</a>
                </div>
            </div>
        `;
                });

                return detailsHtml;
            }

            // ==================== 操作 ====================
            async function cycleStatus(id) {
                if (!isAdmin) return;
                const item = items.find(i => i.id === id);
                if (!item) return;
                const current = item.status || STATUS.TODO;

                let newStatus;
                if (current === STATUS.TODO) newStatus = STATUS.DOING;
                else if (current === STATUS.DOING) newStatus = STATUS.DONE;
                else newStatus = STATUS.TODO;

                try {
                    await apiUpdate(id, { status: newStatus });
                    item.status = newStatus;

                    // 重置详情状态（因为状态变了，详情内容可能不一样，需要重新注入）
                    const itemEl = document.querySelector(`.item[data-id="${id}"]`);
                    if (itemEl) {
                        const detailsEl = itemEl.querySelector('.item-details');
                        if (detailsEl) {
                            detailsEl.classList.remove('show');
                            detailsEl.style.maxHeight = '';
                            detailsEl.innerHTML = '';
                            delete detailsEl.dataset.loaded;
                            clearTimeout(detailsEl._expandTimer);
                            clearTimeout(detailsEl._collapseTimer);
                        }
                    }
                    item.expanded = false;

                    render();

                    // 如果变成已汉化但没中译名，自动展开编辑弹窗
                    if (newStatus === STATUS.DONE && !item.translated) {
                        setTimeout(() => openEditModal(id), 100);
                    }
                } catch (e) {
                    showToast('操作失败');
                }
            }

            function toggleExpand(id) {
                const item = items.find(i => i.id === id);
                if (!item) return;

                const itemEl = document.querySelector(`.item[data-id="${id}"]`);
                if (!itemEl) return;
                const detailsEl = itemEl.querySelector('.item-details');
                if (!detailsEl) return;

                const isOpening = !item.expanded;
                item.expanded = isOpening;

                if (isOpening) {
                    // 1. 先注入内容（如果还没注入过）
                    if (!detailsEl.dataset.loaded) {
                        detailsEl.innerHTML = buildDetailsHtml(item);
                        detailsEl.dataset.loaded = '1';
                    }
                    // 2. 触发动画：先让 max-height 有值，再在下一帧加 .show
                    detailsEl.classList.remove('show');
                    // 强制 reflow，确保 transition 能触发
                    void detailsEl.offsetHeight;
                    detailsEl.classList.add('show');

                    // 3. 动画结束后把 max-height 设为 none，让内容自适应（避免超高内容被截断）
                    clearTimeout(detailsEl._expandTimer);
                    detailsEl._expandTimer = setTimeout(() => {
                        if (detailsEl.classList.contains('show')) {
                            detailsEl.style.maxHeight = 'none';
                        }
                    }, 350);
                } else {
                    // 收起：先把 max-height 从 none 恢复成具体值，才能过渡
                    if (detailsEl.style.maxHeight === 'none') {
                        detailsEl.style.maxHeight = detailsEl.scrollHeight + 'px';
                        // 强制 reflow
                        void detailsEl.offsetHeight;
                    }
                    detailsEl.style.maxHeight = '';
                    detailsEl.classList.remove('show');

                    // 收起动画结束后，可以清空内容释放 DOM（可选）
                    clearTimeout(detailsEl._collapseTimer);
                    detailsEl._collapseTimer = setTimeout(() => {
                        if (!detailsEl.classList.contains('show')) {
                            // 保留 dataset.loaded 状态，避免再次展开时重复注入
                            // 如果想进一步省内存，这里可以清空 innerHTML 并删掉 data-loaded
                        }
                    }, 350);
                }
            }

            // ==================== 编辑弹窗 ====================
            function openEditModal(id) {
                if (!isAdmin) return;
                const item = items.find(i => i.id === id);
                if (!item) return;
                editingItemId = id;

                document.getElementById('editOriginal').value = item.original || '';
                document.getElementById('editTranslated').value = item.translated || '';
                document.getElementById('editAuthor').value = item.author || '佚名';
                document.getElementById('editDescription').value = item.description || '';

                const isDone = item.status === STATUS.DONE;
                document.getElementById('editTranslatedField').style.display = isDone ? 'block' : 'none';

                document.getElementById('editModal').classList.add('show');
                document.getElementById('editOriginal').focus();
            }

            function closeEditModal() {
                document.getElementById('editModal').classList.remove('show');
                editingItemId = null;
            }

            async function saveEditModal() {
                if (!editingItemId) return;
                const item = items.find(i => i.id === editingItemId);
                if (!item) return;

                const fields = {
                    original: document.getElementById('editOriginal').value.trim() || item.original,
                    author: document.getElementById('editAuthor').value.trim() || '佚名',
                    description: document.getElementById('editDescription').value.trim()
                };
                if (item.status === STATUS.DONE) {
                    fields.translated = document.getElementById('editTranslated').value.trim();
                }

                try {
                    await apiUpdate(editingItemId, fields);
                    Object.assign(item, fields);

                    // 详情内容需要重新生成
                    const itemEl = document.querySelector(`.item[data-id="${editingItemId}"]`);
                    if (itemEl) {
                        const detailsEl = itemEl.querySelector('.item-details');
                        if (detailsEl) {
                            detailsEl.classList.remove('show');
                            detailsEl.style.maxHeight = '';
                            detailsEl.innerHTML = '';
                            delete detailsEl.dataset.loaded;
                            clearTimeout(detailsEl._expandTimer);
                        }
                    }
                    item.expanded = false;

                    closeEditModal();
                    render();
                    showToast('已保存');
                } catch (e) {
                    showToast('保存失败');
                }
            }

            async function deleteFromModal() {
                if (!editingItemId) return;
                const item = items.find(i => i.id === editingItemId);
                if (!item) return;
                if (!confirm(`确定要移除「${item.original}」吗？`)) return;

                try {
                    await apiDelete(editingItemId);
                    items = items.filter(i => i.id !== editingItemId);
                    closeEditModal();
                    render();
                    showToast('已移除');
                } catch (e) {
                    showToast('移除失败');
                }
            }

            // ==================== 复制/跳转 ====================
            function copyText(text) {
                if (!text) { showToast('链接为空'); return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
                if (ok) showToast('已复制');
                else prompt('请手动复制:', text);
            }

            function openLink(id, field) {
                const item = items.find(i => i.id === id);
                if (!item) return;
                let url = (item[field] || '').trim();
                if (!url) { showToast('链接为空'); return; }
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                // 走风险提醒
                showExternalWarning(url, () => {
                    window.open(url, '_blank', 'noopener,noreferrer');
                });
            }

            // ==================== 导入 ====================
            async function importList() {
                const input = document.getElementById('importInput');
                const raw = input.value.trim();
                if (!raw) return;

                const lines = raw.split(/\n/).map(l => l.trim()).filter(l => l.length > 0);
                const newItems = [];

                lines.forEach(line => {
                    let author = '佚名';
                    let rest = line;
                    const pipeIdx = line.lastIndexOf('|');
                    if (pipeIdx !== -1) {
                        author = line.slice(pipeIdx + 1).trim() || '佚名';
                        rest = line.slice(0, pipeIdx).trim();
                    }

                    const match = rest.match(/^([^(（]+)[(（]([^)）]+)[)）]/);
                    let original = '', translated = '';
                    if (match) {
                        original = match[1].trim();
                        translated = match[2].trim();
                    } else {
                        original = rest.trim();
                    }
                    if (!original) return;

                    if (items.some(i => i.original.toLowerCase() === original.toLowerCase())) return;

                    const status = (translated && hasChinese(translated)) ? STATUS.DONE : STATUS.TODO;
                    newItems.push({
                        original,
                        translated,
                        author,
                        status
                    });
                });

                if (newItems.length === 0) {
                    showToast('没有可导入的新项目');
                    return;
                }

                try {
                    await apiBatchCreate(newItems);
                    await loadItems(false);
                    render();
                    input.value = '';
                    document.getElementById('importInputWrap').style.display = 'none';
                    showToast(`成功导入 ${newItems.length} 条`);
                } catch (e) {
                    showToast('导入失败');
                }
            }

            // ==================== 导出 ====================
            function exportData() {
                const exportItems = items.map(item => ({
                    original: item.original,
                    translated: item.translated,
                    author: item.author,
                    authorLink: item.authorLink,
                    translationLink: item.translationLink,
                    originalLink: item.originalLink,
                    description: item.description || '',
                    status: item.status || STATUS.TODO
                }));
                const dataStr = `// 天际译栈 汉化数据导出\n// 导出时间: ${new Date().toLocaleString()}\nconst TRANSLATION_DATA = ${JSON.stringify(exportItems, null, 2)};\n`;
                const blob = new Blob([dataStr], { type: 'application/javascript' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `天际译栈_汉化数据_${new Date().toISOString().slice(0, 10)}.js`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ==================== 登录 ====================
            function updateLoginUI() {
                const toolbar = document.getElementById('adminToolbar');
                const annEditBtn = document.getElementById('announcementEditBtn');
                const loginText = document.getElementById('menuLoginText');
                const loginIcon = document.querySelector('#menuLoginBtn .menu-item-icon');

                if (isAdmin) {
                    loginText.textContent = currentUsername || '管理员';
                    loginIcon.textContent = '🚪';   // 退出图标
                    toolbar.style.display = '';
                    if (annEditBtn) annEditBtn.style.display = '';
                } else {
                    loginText.textContent = '注册 / 登录';
                    loginIcon.textContent = '👤';
                    toolbar.style.display = 'none';
                    if (annEditBtn) annEditBtn.style.display = 'none';
                }
            }

            async function tryLogin() {
                if (!authToken) return;
                try {
                    const res = await fetch(`${API_BASE}/items?all=1`, {
                        headers: authHeaders()
                    });
                    if (res.ok) {
                        isAdmin = true;
                    } else {
                        authToken = '';
                        localStorage.removeItem(TOKEN_KEY);
                    }
                } catch (e) {
                    // 网络错误，暂不处理
                }
                updateLoginUI();
            }

            function openLoginModal() {
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginModal').classList.add('show');
                document.getElementById('loginPassword').focus();
            }

            function closeLoginModal() {
                document.getElementById('loginModal').classList.remove('show');
            }

            async function submitLogin() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (data.token) {
                        authToken = data.token;
                        currentUsername = data.username || username;  // ⭐ 记录用户名
                        localStorage.setItem(TOKEN_KEY, authToken);
                        localStorage.setItem('tianji_username', currentUsername);  // ⭐ 持久化
                        isAdmin = true;
                        closeLoginModal();
                        updateLoginUI();
                        await loadItems(false);
                        render();
                        showToast('登录成功');
                    } else {
                        showToast(data.error || '登录失败');
                    }
                } catch (e) {
                    showToast('网络错误');
                }
            }

            function logout() {
                authToken = '';
                isAdmin = false;
                currentUsername = '';  // ⭐
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem('tianji_username');  // ⭐
                updateLoginUI();
                loadItems(true).then(render);
                showToast('已退出');
            }

            // ==================== 事件绑定 ====================
            function setupEvents() {
                const app = document.querySelector('.app');

                // 主题切换
                document.getElementById('themeToggleBtn').addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme') || 'light';
                    applyTheme(current === 'dark' ? 'light' : 'dark');
                });

                // ========== 外部链接风险提醒 ==========
                document.addEventListener('click', (e) => {
                    const link = e.target.closest('a[target="_blank"]');
                    if (!link) return;
                    const href = link.href || '';
                    // 同域链接不拦截
                    try {
                        const url = new URL(href);
                        if (url.hostname === location.hostname) return;
                    } catch (err) {
                        return;
                    }
                    // 已经确认过的直接放行
                    if (link.dataset.confirmed === '1') {
                        delete link.dataset.confirmed;
                        return;
                    }
                    e.preventDefault();
                    showExternalWarning(href, () => {
                        link.dataset.confirmed = '1';
                        link.click();
                    });
                }, true);

                // ========== 窗口 resize 时重新检测公告 ==========
                let resizeTimer = null;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        checkAnnouncementOverflow();
                    }, 200);
                });

                // ========== 顶栏滚动隐藏/显示 ==========
                (function setupTopNavScroll() {
                    const topNav = document.querySelector('.top-nav');
                    if (!topNav) return;

                    let lastScrollY = window.scrollY;
                    let ticking = false;
                    const THRESHOLD = 8;       // 滚动多少像素才触发（防止抖动）
                    const TOP_OFFSET = 60;     // 页面顶部多少像素内始终显示

                    function onScroll() {
                        const currentY = window.scrollY;

                        // 页面靠近顶部时始终显示
                        if (currentY <= TOP_OFFSET) {
                            topNav.classList.remove('hidden');
                            lastScrollY = currentY;
                            return;
                        }

                        const delta = currentY - lastScrollY;

                        if (Math.abs(delta) < THRESHOLD) return;

                        if (delta > 0) {
                            // 向下滚动 → 隐藏
                            topNav.classList.add('hidden');
                        } else {
                            // 向上滚动 → 显示
                            topNav.classList.remove('hidden');
                        }

                        lastScrollY = currentY;
                    }

                    window.addEventListener('scroll', () => {
                        if (!ticking) {
                            window.requestAnimationFrame(() => {
                                onScroll();
                                ticking = false;
                            });
                            ticking = true;
                        }
                    }, { passive: true });
                })();
                // 公告栏关闭
                const annBar = document.getElementById('announcementBar');
                const annClosed = localStorage.getItem('tianji_announcement_closed');
                if (annClosed === '1') {
                    annBar.style.display = 'none';
                }
                document.getElementById('announcementClose').addEventListener('click', () => {
                    annBar.style.display = 'none';
                    localStorage.setItem('tianji_announcement_closed', '1');
                });

                // 模块展开/收起
                document.getElementById('pendingToggle').addEventListener('click', function () {
                    moduleExpanded.pending = !moduleExpanded.pending;
                    updateModuleStyles();
                });
                document.getElementById('doneToggle').addEventListener('click', function () {
                    moduleExpanded.done = !moduleExpanded.done;
                    updateModuleStyles();
                });

                // ========== 搜索面板 ==========
                const searchPanel = document.getElementById('searchPanel');
                const searchToggleBtn = document.getElementById('searchToggleBtn');
                const searchInput = document.getElementById('searchInput');
                const searchClear = document.getElementById('searchClear');

                searchToggleBtn.addEventListener('click', () => {
                    const isOpen = searchPanel.classList.contains('show');
                    if (isOpen) {
                        searchPanel.classList.remove('show');
                    } else {
                        searchPanel.classList.add('show');
                        setTimeout(() => searchInput.focus(), 280);
                    }
                });

                searchInput.addEventListener('input', function () {
                    searchQuery = this.value.trim();
                    searchClear.style.display = searchQuery ? 'block' : 'none';
                    render();
                });

                searchClear.addEventListener('click', function () {
                    searchInput.value = '';
                    searchQuery = '';
                    searchClear.style.display = 'none';
                    render();
                });

                // ========== 下拉菜单 ==========
                const menuToggleBtn = document.getElementById('menuToggleBtn');
                const menuDropdown = document.getElementById('menuDropdown');

                menuToggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menuDropdown.classList.toggle('show');
                });

                // 点击其他地方关闭菜单
                document.addEventListener('click', (e) => {
                    if (!menuDropdown.contains(e.target) && e.target !== menuToggleBtn) {
                        menuDropdown.classList.remove('show');
                    }
                });

                // 事件委托
                app.addEventListener('click', (e) => {
                    const statusIcon = e.target.closest('[data-action="cycle-status"]');
                    if (statusIcon) { cycleStatus(statusIcon.dataset.id); return; }

                    const expandBtn = e.target.closest('[data-action="expand"]');
                    if (expandBtn) { toggleExpand(expandBtn.dataset.id); return; }

                    const editBtn = e.target.closest('[data-action="edit-item"]');
                    if (editBtn) { openEditModal(editBtn.dataset.id); return; }

                    const copyBtn = e.target.closest('[data-copy]');
                    if (copyBtn) {
                        const item = items.find(i => i.id === copyBtn.dataset.id);
                        if (item) copyText(item[copyBtn.dataset.copy] || '');
                        return;
                    }

                    const openBtn = e.target.closest('[data-action="open-link"]');
                    if (openBtn) {
                        e.preventDefault();
                        openLink(openBtn.dataset.id, openBtn.dataset.field);
                        return;
                    }
                });

                // 链接输入（仅管理员，失焦时保存）
                app.addEventListener('blur', async (e) => {
                    const input = e.target.closest('.detail-input');
                    if (!input || !isAdmin) return;
                    const id = input.dataset.id;
                    const field = input.dataset.field;
                    const item = items.find(i => i.id === id);
                    if (!item) return;
                    if (item[field] === input.value.trim()) return;
                    try {
                        await apiUpdate(id, { [field]: input.value.trim() });
                        item[field] = input.value.trim();
                        showToast('已保存');
                    } catch (err) {
                        showToast('保存失败');
                    }
                }, true);

                // ========== 拖拽排序（仅管理员） ==========
                let dragSrcEl = null;

                app.addEventListener('dragstart', (e) => {
                    if (!isAdmin) return;
                    const handle = e.target.closest('.drag-handle');
                    if (!handle) return;
                    const item = handle.closest('.item');
                    if (!item) return;
                    dragSrcEl = item;
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                app.addEventListener('dragover', (e) => {
                    if (!isAdmin || !dragSrcEl) return;
                    e.preventDefault();
                    const target = e.target.closest('.item');
                    if (!target || target === dragSrcEl) return;
                    target.classList.add('drag-over');
                });

                app.addEventListener('dragleave', (e) => {
                    const target = e.target.closest('.item');
                    if (target) target.classList.remove('drag-over');
                });

                app.addEventListener('drop', async (e) => {
                    if (!isAdmin || !dragSrcEl) return;
                    e.preventDefault();
                    const target = e.target.closest('.item');
                    if (!target || target === dragSrcEl) return;
                    target.classList.remove('drag-over');

                    const srcId = dragSrcEl.dataset.id;
                    const dstId = target.dataset.id;
                    if (!srcId || !dstId) return;

                    // 只允许同模块内排序
                    const srcDone = items.find(i => i.id === srcId)?.status === STATUS.DONE;
                    const dstDone = items.find(i => i.id === dstId)?.status === STATUS.DONE;
                    if (srcDone !== dstDone) {
                        showToast('只能在同一个模块内排序');
                        dragSrcEl.classList.remove('dragging');
                        dragSrcEl = null;
                        return;
                    }

                    // 更新本地 items 顺序
                    const allIds = items.map(i => i.id);
                    const srcIdx = allIds.indexOf(srcId);
                    const dstIdx = allIds.indexOf(dstId);
                    if (srcIdx === -1 || dstIdx === -1) return;

                    const [moved] = items.splice(srcIdx, 1);
                    items.splice(dstIdx, 0, moved);

                    // 构建批量排序数据
                    const reorderList = items.map((it, idx) => ({ id: it.id, sortOrder: idx }));

                    dragSrcEl.classList.remove('dragging');
                    dragSrcEl = null;
                    render();

                    try {
                        await apiReorder(reorderList);
                        showToast('排序已保存');
                    } catch (err) {
                        showToast('排序保存失败');
                        await loadItems(false);
                        render();
                    }
                });

                app.addEventListener('dragend', () => {
                    document.querySelectorAll('.item.dragging, .item.drag-over').forEach(el => {
                        el.classList.remove('dragging', 'drag-over');
                    });
                    dragSrcEl = null;
                });

                // 赞助
                document.getElementById('sponsorBtn').addEventListener('click', () => {
                    document.getElementById('qrModal').classList.add('show');
                });
                document.getElementById('qrCloseBtn').addEventListener('click', () => {
                    document.getElementById('qrModal').classList.remove('show');
                });

                // ========== 菜单：登录/退出 ==========
                document.getElementById('menuLoginBtn').addEventListener('click', () => {
                    menuDropdown.classList.remove('show');
                    if (isAdmin) {
                        if (confirm('已登录。要退出登录吗？')) logout();
                    } else {
                        openLoginModal();
                    }
                });

                // 消息按钮（未装）
                document.getElementById('menuMessageBtn').addEventListener('click', () => {
                    menuDropdown.classList.remove('show');
                    showToast('消息功能未装，敬请期待～');
                });


                document.getElementById('loginSubmitBtn').addEventListener('click', submitLogin);
                document.getElementById('loginCancelBtn').addEventListener('click', closeLoginModal);
                document.getElementById('loginPassword').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') submitLogin();
                });

                // 编辑弹窗
                document.getElementById('editSaveBtn').addEventListener('click', saveEditModal);
                document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
                document.getElementById('editDeleteBtn').addEventListener('click', deleteFromModal);

                // 管理员工具栏
                document.getElementById('importToggleBtn').addEventListener('click', () => {
                    const wrap = document.getElementById('importInputWrap');
                    const isHidden = wrap.style.display === 'none' || !wrap.style.display;
                    wrap.style.display = isHidden ? 'flex' : 'none';
                    if (isHidden) document.getElementById('importInput').focus();
                });
                document.getElementById('importConfirmBtn').addEventListener('click', importList);
                document.getElementById('importInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') importList();
                });
                document.getElementById('exportBtn').addEventListener('click', exportData);
                // JS 快速导入
                document.getElementById('jsImportBtn').addEventListener('click', () => {
                    document.getElementById('jsFileInput').click();
                });

                document.getElementById('jsFileInput').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    e.target.value = '';

                    try {
                        const text = await file.text();
                        // 去掉 BOM
                        const cleanText = text.replace(/^\uFEFF/, '');

                        let data;
                        // 1. 尝试匹配 const TRANSLATION_DATA = [...] 带分号
                        let match = cleanText.match(/const\s+TRANSLATION_DATA\s*=\s*(\[[\s\S]*?\]);/);
                        // 2. 尝试匹配不带分号的
                        if (!match) {
                            match = cleanText.match(/const\s+TRANSLATION_DATA\s*=\s*(\[[\s\S]*?\])/);
                        }
                        if (match) {
                            // 用 Function 构造器来解析 JS 对象字面量（比 JSON.parse 宽松）
                            try {
                                data = JSON.parse(match[1]);
                            } catch (jsonErr) {
                                // 如果 JSON.parse 失败，用 Function 解析 JS 语法
                                data = (new Function('return ' + match[1]))();
                            }
                        } else {
                            // 尝试直接当 JSON 数组解析
                            try {
                                data = JSON.parse(cleanText);
                            } catch (jsonErr) {
                                // 再试试当 JS 表达式解析
                                data = (new Function('return ' + cleanText))();
                            }
                        }
                        if (!Array.isArray(data)) throw new Error('不是数组');

                        // 过滤掉 original 为空的条目
                        const validItems = data.filter(it => it.original && it.original.trim());

                        // 过滤掉已存在的
                        const newItems = validItems.filter(it => {
                            return !items.some(existing =>
                                existing.original.toLowerCase() === it.original.toLowerCase()
                            );
                        });

                        if (newItems.length === 0) {
                            showToast('没有新项目可导入（可能都已存在或 original 为空）');
                            return;
                        }

                        // 逐个转换字段名
                        const batch = newItems.map(it => ({
                            original: it.original,
                            translated: it.translated || '',
                            author: it.author || '佚名',
                            authorLink: it.authorLink || it.author_link || '',
                            translationLink: it.translationLink || it.translation_link || '',
                            originalLink: it.originalLink || it.original_link || '',
                            description: it.description || '',
                            status: it.status || 'todo'
                        }));

                        await apiBatchCreate(batch);
                        await loadItems(false);
                        render();
                        showToast(`成功导入 ${batch.length} 条`);
                    } catch (err) {
                        showToast('文件格式不正确：' + err.message);
                    }
                });


                // ========== 公告编辑 ==========
                document.getElementById('announcementEditBtn').addEventListener('click', () => {
                    const current = announcementList.join('\n');
                    document.getElementById('announcementInput').value = current;
                    document.getElementById('announcementModal').classList.add('show');
                    document.getElementById('announcementInput').focus();
                });

                document.getElementById('announcementCancelBtn').addEventListener('click', () => {
                    document.getElementById('announcementModal').classList.remove('show');
                });

                document.getElementById('announcementSaveBtn').addEventListener('click', async () => {
                    const value = document.getElementById('announcementInput').value.trim();
                    try {
                        await saveAnnouncement(value);
                        // 重新加载公告列表并刷新轮播
                        const lines = value.split(/\n/).map(s => s.trim()).filter(s => s.length > 0);
                        announcementList = lines.length > 0 ? lines : ['欢迎来到天际译栈！'];
                        renderAnnouncement();
                        startAnnouncementRotate();
                        document.getElementById('announcementModal').classList.remove('show');
                        showToast('公告已更新');
                    } catch (err) {
                        showToast('保存失败');
                    }
                });

                document.getElementById('announcementModal').addEventListener('click', (e) => {
                    if (e.target.id === 'announcementModal') {
                        document.getElementById('announcementModal').classList.remove('show');
                    }
                });

                // 弹窗点外部关闭
                ['qrModal', 'loginModal', 'editModal'].forEach(id => {
                    document.getElementById(id).addEventListener('click', (e) => {
                        if (e.target.id === id) {
                            document.getElementById(id).classList.remove('show');
                        }
                    });
                });
            }

            // ==================== 初始化 ====================
            async function init() {
                // 应用当前主题
                const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
                applyTheme(savedTheme);

                currentUsername = localStorage.getItem('tianji_username') || '';

                // 恢复收款码
                if (qrImageSrc) {
                    document.getElementById('qrImage').innerHTML = `<img src="${qrImageSrc}" alt="收款码">`;
                }

                await fetchAnnouncement();

                // 检查登录状态
                await tryLogin();

                // 加载数据（首次可用缓存）
                await loadItems(true);

                // 渲染
                render();
                updateLoginUI();

                // 绑定事件
                setupEvents();
            }

            init();
        })();
    </script>
</body>
