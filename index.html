<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>天际译栈 - 我的世界基岩版附加包汉化分享</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
    <!-- SEO -->
    <meta name="description" content="天际译栈是栈主整理的 Minecraft 基岩版附加包汉化列表，包含光影、材质包、地图、附加包等资源。">
    <meta name="keywords" content="我的世界,基岩版,附加包,汉化,光影,材质包,地图,Minecraft">
    <meta name="author" content="栈主">
    <!-- 防暗黑模式闪烁 -->
    <script>
        (function () {
            try {
                const t = localStorage.getItem('tianji_theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <style>
        /* ==================== 主题变量 ==================== */
        :root {
            --bg-page: #f5f7fb;
            --bg-card: #ffffff;
            --bg-module: #fafdff;
            --bg-header: #f0f6fd;
            --bg-input: #ffffff;
            --bg-search: #f9fcff;
            --bg-hover: #e9f0f8;
            --bg-tag: #ecf3fa;
            --text-main: #1e2b3a;
            --text-title: #2c3e50;
            --text-sub: #4f6b84;
            --text-muted: #6d8aa8;
            --text-light: #8fa2b5;
            --text-item: #1c2e40;
            --text-orig: #1e3d5e;
            --text-trans: #426c8a;
            --border: #e2e9f0;
            --border-light: #eef2f6;
            --border-input: #ccdceb;
            --border-soft: #e8eef5;
            --accent: #1e4d6b;
            --accent-hover: #123a52;
            --accent-light: #dbeafe;
            --accent-text: #1d4e7a;
            --accent-border: #c2daf5;
            --shadow: 0 20px 40px -10px rgba(0, 20, 40, 0.15);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.02);
            --scrollbar-track: #eef2f6;
            --scrollbar-thumb: #bdd3e6;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
            --danger-bg-hover: #fecaca;
            --announce-bg: linear-gradient(90deg, #e0f2fe, #f0f9ff);
            --announce-border: #bae6fd;
            --announce-text: #075985;
        }

        [data-theme="dark"] {
            --bg-page: #0f1218;
            --bg-card: #181c24;
            --bg-module: #1a1f28;
            --bg-header: #232936;
            --bg-input: #232936;
            --bg-search: #1e242e;
            --bg-hover: #2a3240;
            --bg-tag: #252c38;
            --text-main: #e4e9f0;
            --text-title: #d8dfe8;
            --text-sub: #a8b5c4;
            --text-muted: #8894a4;
            --text-light: #78859a;
            --text-item: #dde4ec;
            --text-orig: #e8eef5;
            --text-trans: #9ab4cc;
            --border: #2a313c;
            --border-light: #232830;
            --border-input: #333b48;
            --border-soft: #262c36;
            --accent: #3b7a9e;
            --accent-hover: #4a8fb5;
            --accent-light: #2a3a4a;
            --accent-text: #9bc4e0;
            --accent-border: #34506a;
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.2);
            --scrollbar-track: #232830;
            --scrollbar-thumb: #3a4351;
            --danger-bg: #3d1f22;
            --danger-text: #f0a8a8;
            --danger-bg-hover: #4a2529;
            --announce-bg: linear-gradient(90deg, #1e3a5f, #1e293b);
            --announce-border: #334155;
            --announce-text: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            padding: 5rem 1rem 2rem;
            /* 顶部从 2rem 改成 5rem，留出导航栏高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .app {
            max-width: 900px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 1.5rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }


        /* ==================== 公告栏 ==================== */
        .announcement {
            background: var(--announce-bg);
            border: 1px solid var(--announce-border);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--announce-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            line-height: 1.5;
        }

        .announcement-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .announcement-viewport {
            flex: 1;
            overflow: hidden;
            height: 1.5em;
            /* 单行高度 */
            position: relative;
        }

        .announcement-track {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .announcement-track .announcement-text {
            height: 1.5em;
            line-height: 1.5;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        /* 文字内容包一层，用于滚动 */
        .announcement-track .announcement-text>span {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        /* 只有当内容宽度超出容器时才添加滚动动画 */
        /* 滚动由 JS 控制，不再用 CSS animation */
        .announcement-track .announcement-text>span {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
            transition: transform 0.1s linear;
            /* JS 每帧更新，这里只做兜底 */
        }

        .announcement-close {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0.5;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.2rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .announcement-close:hover {
            opacity: 1;
        }

        .announcement-edit {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0.6;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 0.2rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .announcement-edit:hover {
            opacity: 1;
        }

        .top-bar {
            flex-shrink: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .top-left {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .sponsor-btn {
            background: #ffe9c7;
            border: none;
            border-radius: 60px;
            padding: 0.7rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #a05e1a;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 180, 80, 0.2);
            transition: all 0.2s ease;
            border: 1px solid #ffd9a3;
        }

        .sponsor-btn:hover {
            background: #ffddb0;
            transform: scale(1.02);
        }

        .login-btn {
            background: var(--bg-tag);
            border: 1px solid var(--accent-border);
            border-radius: 60px;
            padding: 0.7rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--accent-text);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: var(--bg-hover);
        }

        .login-btn.admin {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }

        .bili-btn {
            background: #ffe6f0;
            border: 1px solid #ffb3d1;
            border-radius: 60px;
            padding: 0.7rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #d63384;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .bili-btn:hover {
            background: #ffd0e0;
        }

        /* 主题切换按钮 */
        .theme-btn {
            background: var(--bg-tag);
            border: 1px solid var(--border);
            border-radius: 60px;
            width: 40px;
            height: 40px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-main);
        }

        .theme-btn:hover {
            background: var(--bg-hover);
        }

        .modules-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .module {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            background: var(--bg-module);
            overflow: hidden;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .module-body {
            max-height: 260px;
            overflow-y: auto;
            transition:
                max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .module.module-expanded .module-body {
            max-height: 5000px;
            overflow-y: auto;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.9rem;
            background: var(--bg-header);
            cursor: default;
            flex-shrink: 0;
            user-select: none;
            transition: background 0.2s;
        }

        .module-header-right {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            position: relative;
            /* ⭐ 加这个 */
        }

        .archive-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-tag);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.3rem 0.7rem;
            font-size: 0.78rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }

        .archive-btn:hover {
            background: var(--bg-hover);
        }

        .archive-arrow {
            font-size: 0.6rem;
            opacity: 0.6;
        }

        /* 归档菜单 */
        .archive-menu {
            /* 收起状态：仍然占据位置，但不可见 */
            display: block;
            position: fixed;
            top: -9999px;
            /* 默认移出屏幕，防止占位 */
            left: -9999px;
            min-width: 120px;
            max-width: 160px;
            width: max-content;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.12);
            padding: 6px;
            z-index: 300;
            /* 收起状态 */
            opacity: 0;
            transform: translateY(-8px) scaleY(0.94);
            transform-origin: top center;
            pointer-events: none;
            transition:
                opacity 0.2s ease,
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .archive-menu.show {
            opacity: 1;
            transform: translateY(0) scaleY(1);
            pointer-events: auto;
            top: 0;
            /* JS 会覆盖这个值 */
            left: 0;
        }

        @media (max-width: 380px) {
            .archive-menu {
                right: auto;
                left: 0;
            }
        }

        .archive-menu-item {
            display: block;
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: background 0.12s;
            font-family: inherit;
            white-space: nowrap;
            box-sizing: border-box;
            /* ⭐ 关键 */
        }

        .archive-menu-item:hover {
            background: var(--bg-hover);
        }

        .archive-menu-item.active {
            background: var(--accent-light);
            color: var(--accent-text);
            font-weight: 500;
        }

        .module-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            white-space: nowrap;
        }

        .module-title .emoji {
            font-size: 1rem;
            line-height: 1;
        }

        .module-title .badge {
            background: var(--accent-light);
            color: var(--accent-text);
            font-size: 0.7rem;
            border-radius: 30px;
            padding: 0.05rem 0.55rem;
            font-weight: 500;
        }

        .module-toggle {
            background: transparent;
            border: none;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 30px;
            transition: 0.15s;
            line-height: 1;
        }

        .module-toggle:hover {
            background: var(--bg-hover);
        }

        .module-body {
            flex: 1;
            padding: 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            scrollbar-width: thin;
            min-height: 0;
        }

        .module-body::-webkit-scrollbar {
            width: 8px;
        }

        .module-body::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 20px;
        }

        .module-body::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 20px;
        }

        .bottom-bar {
            flex-shrink: 0;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .bottom-left {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .bottom-right {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent-light);
            border: none;
            padding: 0.7rem 1.3rem;
            border-radius: 40px;
            font-weight: 500;
            color: var(--accent-text);
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .btn-danger:hover {
            background: var(--danger-bg-hover);
        }

        .item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-soft);
            transition: all 0.15s;
        }

        .item:hover {
            border-color: var(--scrollbar-thumb);
        }

        .item-top {
            display: flex;
            align-items: flex-start;
            padding: 0.6rem 0.9rem 0.3rem 0.9rem;
            gap: 0.5rem;
        }

        .status-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            font-size: 0.88rem;
            line-height: 1;
            transition: 0.15s;
            width: 22px;
            height: 22px;
            color: var(--text-muted);
            border-radius: 4px;
            margin-top: 1px;
        }

        .status-icon:hover {
            background: var(--bg-hover);
        }

        .status-icon.done {
            color: #2e7d32;
        }

        .status-icon.in-progress {
            color: #b45309;
        }

        .item-name {
            flex: 1;
            font-weight: 500;
            color: var(--text-item);
            min-width: 0;
            word-break: break-word;
            font-size: 0.88rem;
            line-height: 1.5;
            padding-top: 1px;
        }

        .item-name .orig {
            font-weight: 600;
            color: var(--text-orig);
        }

        .item-name .trans {
            color: var(--text-trans);
            font-weight: 400;
            margin-left: 0.1rem;
        }

        .item-bottom {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 0.9rem 0.6rem 0.9rem;
            gap: 0.5rem;
        }

        .author-name {
            font-size: 0.82rem;
            color: var(--text-sub);
            background: var(--bg-tag);
            padding: 0.2rem 0.75rem;
            border-radius: 40px;
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .edit-icon-btn {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            color: var(--text-light);
            cursor: pointer;
            padding: 0.2rem 0.3rem;
            border-radius: 30px;
            transition: 0.15s;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .edit-icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-sub);
        }

        .expand-btn {
            background: transparent;
            border: none;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 30px;
            transition: 0.15s;
            line-height: 1;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .expand-btn:hover {
            background: var(--bg-hover);
        }

        .item-details {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            padding: 0 0.9rem;
            margin-top: 0;
            background: var(--bg-module);
            border-radius: 0 0 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            border-top: 1px dashed transparent;
            transition:
                max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.22s ease,
                padding 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                margin-top 0.32s ease,
                border-top-color 0.32s ease;
        }

        .item-details.show {
            max-height: 3000px;
            /* 上限，够用即可；动画结束后由 JS 置为 none */
            opacity: 1;
            padding: 0.7rem 0.9rem 1rem 0.9rem;
            margin-top: 0.2rem;
            border-top-color: var(--border-input);
        }

        .item-description {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.6;
            padding: 0.2rem 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            width: 65px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .detail-input {
            flex: 1;
            min-width: 160px;
            padding: 0.45rem 0.7rem;
            border: 1px solid var(--border-input);
            border-radius: 10px;
            font-size: 0.85rem;
            background: var(--bg-input);
            color: var(--text-main);
            transition: 0.15s;
        }

        .detail-input:focus {
            outline: 2px solid var(--accent-border);
            border-color: transparent;
        }

        .detail-readonly {
            flex: 1;
            min-width: 160px;
            font-size: 0.85rem;
            color: var(--text-main);
            word-break: break-all;
            padding: 0.45rem 0;
        }

        .btn-group {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .copy-btn,
        .open-btn {
            background: var(--bg-tag);
            border: none;
            border-radius: 10px;
            padding: 0.45rem 0.7rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent-text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            transition: 0.1s;
            white-space: nowrap;
            flex-shrink: 0;
            text-decoration: none;
        }

        .copy-btn:hover,
        .open-btn:hover {
            background: var(--bg-hover);
        }

        .empty-msg {
            color: var(--text-light);
            font-size: 0.88rem;
            padding: 0.8rem 0.5rem;
            font-style: italic;
        }

        .loading {
            color: var(--text-light);
            font-size: 0.9rem;
            padding: 1rem;
            text-align: center;
        }

        /* 骨架屏 */
        .skeleton-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 0.8rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, var(--border-light) 25%, var(--border) 50%, var(--border-light) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .hidden-file-input {
            display: none;
        }

        .trans-input {
            background: var(--bg-input);
            border: 1px solid #fcd34d;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 2rem 2rem 1.8rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-card h3 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .modal-field {
            margin-bottom: 1rem;
        }

        .modal-field label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border-input);
            border-radius: 12px;
            font-size: 0.9rem;
            background: var(--bg-input);
            color: var(--text-main);
            transition: 0.15s;
            font-family: inherit;
        }

        .modal-field input:focus,
        .modal-field textarea:focus {
            outline: 2px solid var(--accent-border);
            border-color: transparent;
        }

        .modal-field textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .modal-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .qr-img {
            width: 220px;
            height: 220px;
            background: var(--bg-tag);
            border-radius: 20px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 0.9rem;
            border: 2px dashed var(--border-input);
            background-repeat: no-repeat;
            background-position: center;
            background-size: 48px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .qr-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        .qr-img span {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.8);
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2b3a;
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 9999;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .drag-handle {
            flex-shrink: 0;
            cursor: grab;
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
            user-select: none;
            margin-top: 2px;
            letter-spacing: -2px;
        }

        .drag-handle:hover {
            background: var(--bg-hover);
            color: var(--text-muted);
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .item.dragging {
            opacity: 0.4;
        }

        .item.drag-over {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-border);
        }

        /* ============ 底部 footer ============ */
        .site-footer {
            margin-top: 1.5rem;
            padding: 1.5rem 1rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            text-align: center;
        }

        .footer-bili {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            background: #ffe6f0;
            border: 1px solid #ffb3d1;
            border-radius: 60px;
            color: #d63384;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .footer-bili:hover {
            background: #ffd0e0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(214, 51, 132, 0.15);
        }

        .bili-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .footer-copy {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        [data-theme="dark"] .footer-bili {
            background: #3d1f2c;
            border-color: #5c2f43;
            color: #ff9ec8;
        }

        [data-theme="dark"] .footer-bili:hover {
            background: #4a2535;
            box-shadow: 0 4px 12px rgba(255, 158, 200, 0.1);
        }

        /* ============ 顶部固定导航栏 ============ */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 100;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(0, 20, 40, 0.04);
        }

        .top-nav.hidden {
            transform: translateY(-100%);
            box-shadow: none;
        }

        [data-theme="dark"] .top-nav {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            border-bottom-color: var(--border);
        }

        .top-nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.2rem;
        }

        .top-nav-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .top-nav-logo {
            font-size: 1.3rem;
            line-height: 1;
        }

        .top-nav-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin: 0;
            border: none;
            padding: 0;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* 图标按钮（🔍 🌙 ☰） */
        .nav-icon-btn {
            background: transparent;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            transition: background 0.15s;
        }

        .nav-icon-btn:hover {
            background: var(--bg-hover);
        }

        /* 下拉菜单 */
        .menu-wrap {
            position: relative;
        }

        .menu-dropdown {
            display: block;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 180px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            /* ← 矩形：圆角很小 */
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.12);
            padding: 6px;
            z-index: 200;
            /* ↓ 收起状态 */
            opacity: 0;
            transform: translateY(-8px) scaleY(0.96);
            transform-origin: top right;
            pointer-events: none;
            transition:
                opacity 0.2s ease,
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] .menu-dropdown {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .menu-dropdown.show {
            opacity: 1;
            transform: translateY(0) scaleY(1);
            pointer-events: auto;
        }

        @keyframes menuPop {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.88rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-align: left;
            transition: background 0.12s;
            font-family: inherit;
        }

        .menu-item:hover {
            background: var(--bg-hover);
        }

        .menu-item-icon {
            font-size: 1rem;
            line-height: 1;
            width: 18px;
            display: inline-flex;
            justify-content: center;
        }

        .menu-badge {
            margin-left: auto;
            font-size: 0.68rem;
            background: var(--bg-tag);
            color: var(--text-light);
            padding: 0.1rem 0.45rem;
            border-radius: 20px;
        }

        /* ============ 搜索面板 ============ */
        .search-panel {
            max-height: 0;
            overflow: hidden;
            background: var(--bg-card);
            border-bottom: 1px solid transparent;
            transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1), border-bottom-color 0.28s;
        }

        .search-panel.show {
            max-height: 90px;
            border-bottom-color: var(--border-light);
        }

        .search-panel-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0.6rem 1.2rem 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
        }

        .search-panel-icon {
            position: absolute;
            left: 1.7rem;
            color: var(--text-light);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-panel-input {
            width: 100%;
            padding: 0.7rem 2.5rem 0.7rem 2.5rem;
            border: 1px solid var(--border-input);
            border-radius: 40px;
            font-size: 0.9rem;
            background: var(--bg-search);
            color: var(--text-main);
            transition: 0.15s;
            font-family: inherit;
        }

        .search-panel-input::placeholder {
            color: var(--text-light);
        }

        .search-panel-input:focus {
            outline: 2px solid var(--accent-border);
            border-color: transparent;
            background: var(--bg-input);
        }

        .search-panel-clear {
            position: absolute;
            right: 1.8rem;
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.2rem;
            line-height: 1;
        }

        /* ==================== 账户中心 ==================== */
        #pageAccount {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .account-layout {
            display: flex;
            gap: 1rem;
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            min-height: 500px;
            overflow: hidden;
        }

        .account-sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--bg-header);
            padding: 1.2rem 0.8rem;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .account-sidebar-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-title);
            padding: 0 0.6rem 0.6rem;
            border-bottom: 1px solid var(--border-light);
        }

        .account-nav {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .account-nav-item {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-align: left;
            transition: background 0.15s;
            font-family: inherit;
        }

        .account-nav-item:hover {
            background: var(--bg-hover);
        }

        .account-nav-item.active {
            background: var(--accent-light);
            color: var(--accent-text);
            font-weight: 500;
        }

        .account-nav-icon {
            font-size: 1rem;
            width: 20px;
            display: inline-flex;
            justify-content: center;
        }

        .account-nav-badge {
            margin-left: auto;
            font-size: 0.65rem;
            background: var(--bg-tag);
            color: var(--text-light);
            padding: 0.1rem 0.4rem;
            border-radius: 20px;
        }

        .account-main {
            flex: 1;
            padding: 1.8rem 2rem;
            min-width: 0;
        }

        .account-section h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 1.5rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border-light);
        }

        .account-field {
            margin-bottom: 1.2rem;
        }

        .account-field label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .account-field-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .account-field input {
            flex: 1;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border-input);
            border-radius: 12px;
            font-size: 0.9rem;
            background: var(--bg-input);
            color: var(--text-main);
            font-family: inherit;
            transition: 0.15s;
        }

        .account-field input:focus {
            outline: 2px solid var(--accent-border);
            border-color: transparent;
        }

        .account-hint {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 0.4rem;
        }

        .account-readonly {
            padding: 0.6rem 0.9rem;
            background: var(--bg-tag);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .account-empty {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .account-footer-bar {
            max-width: 1000px;
            margin: 1.5rem auto 0;
            display: flex;
            justify-content: center;
        }

        .account-footer-bar .btn {
            min-width: 160px;
            justify-content: center;
        }

        /* 顶栏的"返回主页"按钮 */
        .nav-icon-btn.home {
            background: var(--accent-light);
            color: var(--accent-text);
        }

        /* ==================== 页面切换过渡 ==================== */
        #pageHome,
        #pageAccount {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.28s ease, transform 0.28s ease;
            box-sizing: border-box;
            /* ⭐ 防溢出 */
        }

        #pageAccount {
            max-width: 1000px;
            padding: 0 1rem;
            /* ⭐ 手机端左右留白 */
            box-sizing: border-box;
        }

        /* 页面淡出 */
        .page-leaving {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        /* 页面淡入 */
        .page-entering {
            animation: pageEnter 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pageEnter {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 账户中心宽度约束 ==================== */
        .account-layout {
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
            /* ⭐ flex 子元素可收缩 */
        }

        .account-main {
            min-width: 0;
            box-sizing: border-box;
        }

        .account-field input,
        .account-field select,
        .account-field textarea {
            box-sizing: border-box;
            max-width: 100%;
            min-width: 0;
        }

        /* ==================== 响应式：窄屏 ==================== */
        @media (max-width: 640px) {
            #pageAccount {
                padding: 0 0.75rem;
            }

            .account-layout {
                flex-direction: column;
                border-radius: 20px;
            }

            .account-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                padding: 0.8rem;
                box-sizing: border-box;
            }

            .account-nav {
                flex-direction: row;
                overflow-x: auto;
                gap: 0.4rem;
                -webkit-overflow-scrolling: touch;
            }

            .account-nav-item {
                white-space: nowrap;
                width: auto;
                padding: 0.5rem 0.8rem;
                flex-shrink: 0;
            }

            .account-main {
                padding: 1.2rem 1rem;
            }

            .account-nav-badge {
                display: none;
            }

            .account-field-row {
                flex-wrap: wrap;
                /* ⭐ 输入框+按钮 挤不下时换行 */
            }

            .account-field-row input {
                flex: 1 1 100%;
                /* 输入框占满一行 */
            }

            .account-field-row .btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>



<body>
    <!-- ==================== 顶部导航栏（两页共用） ==================== -->
    <header class="top-nav">
        <div class="top-nav-inner">
            <div class="top-nav-left">
                <span class="top-nav-logo">🌌</span>
                <h1 class="top-nav-title">天际译栈</h1>
            </div>
            <div class="top-nav-right">

                <button class="nav-icon-btn" id="searchToggleBtn" title="搜索">🔍</button>
                <button class="nav-icon-btn" id="themeToggleBtn" title="切换主题">🌙</button>
                <button class="nav-icon-btn home" id="homeBtn" style="display:none;" title="返回主页">🏠</button>
                <div class="menu-wrap">
                    <button class="nav-icon-btn" id="menuToggleBtn" title="菜单">☰</button>
                    <div class="menu-dropdown" id="menuDropdown">
                        <button class="menu-item" id="menuLoginBtn">
                            <span class="menu-item-icon">👤</span>
                            <span id="menuLoginText">注册 / 登录</span>
                        </button>
                        <button class="menu-item" id="menuMessageBtn">
                            <span class="menu-item-icon">📬</span>
                            <span>消息</span>
                            <span class="menu-badge">未装</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索面板：点击 🔍 后从下方滑出 -->
        <div class="search-panel" id="searchPanel">
            <div class="search-panel-inner">
                <span class="search-panel-icon">🔍</span>
                <input type="text" class="search-panel-input" id="searchInput" placeholder="搜索附加包名 / 作者 / 简介...">
                <button class="search-panel-clear" id="searchClear" style="display:none;">✕</button>
            </div>
        </div>
    </header>

    <!-- ==================== 主页 ==================== -->
    <div id="pageHome">
        <div class="app" id="app">
            <!-- 公告栏 -->
            <div class="announcement" id="announcementBar">
                <span class="announcement-icon">📢</span>
                <div class="announcement-viewport" id="announcementViewport">
                    <div class="announcement-track" id="announcementTrack">
                        <div class="announcement-text">加载中...</div>
                    </div>
                </div>
                <button class="announcement-edit" id="announcementEditBtn" style="display:none;"
                    title="编辑公告">✏️</button>
                <button class="announcement-close" id="announcementClose" title="关闭">✕</button>
            </div>

            <!-- 赞助按钮 -->
            <div class="top-bar">
                <div class="top-left">
                    <button class="sponsor-btn" id="sponsorBtn">
                        ☕ 请栈主喝一杯咖啡
                    </button>
                </div>
            </div>

            <!-- 归档下拉菜单（挂在 .app 里，JS 定位） -->
            <div class="archive-menu" id="archiveMenu">
                <button class="archive-menu-item active" data-category="all">全部</button>
                <button class="archive-menu-item" data-category="addon">附加包</button>
                <button class="archive-menu-item" data-category="texture">材质包</button>
                <button class="archive-menu-item" data-category="shader">光影</button>
                <button class="archive-menu-item" data-category="map">地图</button>
            </div>

            <!-- 模块区 -->
            <div class="modules-container" id="modulesContainer">
                <!-- 待汉化模块 -->
                <div class="module" id="pendingModule" style="display:none;">
                    <div class="module-header">
                        <div class="module-title">
                            <span class="emoji">📋</span> 待汉化 / 汉化中 <span class="badge" id="pendingCount">0</span>
                        </div>
                        <button class="module-toggle" id="pendingToggle" data-module="pending" title="展开/收起">▼</button>
                    </div>
                    <div class="module-body" id="pendingList"></div>
                </div>

                <!-- 展示区模块 -->
                <div class="module" id="doneModule">
                    <div class="module-header">
                        <div class="module-title">
                            <span class="emoji">✅</span> 展示区 <span class="badge" id="doneCount">0</span>
                        </div>
                        <div class="module-header-right">
                            <button class="archive-btn" id="archiveBtn" title="筛选">
                                <span class="archive-btn-label" id="archiveBtnLabel">全部</span>

<script>
    (function () {
        // ==================== 配置 ====================
        const API_BASE = 'https://tianji-server-production-d7f3.up.railway.app/api';
        const TOKEN_KEY = 'tianji_token';
        const QR_KEY = 'tianji_qr_image';
        const THEME_KEY = 'tianji_theme';
        const CACHE_KEY = 'tianji_items_cache';
        const CACHE_TTL = 5 * 60 * 1000; // 5 分钟

        // ==================== 状态 ====================
        let items = [];
        let qrImageSrc = localStorage.getItem(QR_KEY) || '';
        let searchQuery = '';
        let authToken = localStorage.getItem(TOKEN_KEY) || '';
        let isAdmin = false;
        let currentUsername = localStorage.getItem('tianji_username') || '';   // ← 加这里
        let editingItemId = null;
        let currentCategory = 'all';   // ⭐ 加这里

        const moduleExpanded = {
            pending: false,
            done: false
        };

        const STATUS = {
            TODO: 'todo',
            DOING: 'doing',
            DONE: 'done'
        };

        // ==================== 主题切换 ====================
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
            try { localStorage.setItem(THEME_KEY, theme); } catch (e) { }
        }

        // ==================== 工具函数 ====================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        // ==================== 外部链接风险提醒 ====================
        function showExternalWarning(url, onConfirm) {
            const modal = document.getElementById('externalWarningModal');
            const urlInput = document.getElementById('externalWarningUrl');
            const confirmBtn = document.getElementById('externalWarningConfirm');
            const cancelBtn = document.getElementById('externalWarningCancel');
            const copyBtn = document.getElementById('externalWarningCopy');

            urlInput.value = url;
            modal.classList.add('show');

            // 用 cloneNode 替换，清掉旧的事件监听，避免多次绑定
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                modal.classList.remove('show');
                if (onConfirm) onConfirm();
            });

            const newCancel = cancelBtn.cloneNode(true);
            cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
            newCancel.addEventListener('click', () => {
                modal.classList.remove('show');
            });

            const newCopy = copyBtn.cloneNode(true);
            copyBtn.parentNode.replaceChild(newCopy, copyBtn);
            newCopy.addEventListener('click', () => {
                copyText(url);
            });

            modal.onclick = (e) => {
                if (e.target === modal) modal.classList.remove('show');
            };
        }

        function hasChinese(text) {
            return /[\u4e00-\u9fa5]/.test(text);
        }

        function authHeaders() {
            const h = { 'Content-Type': 'application/json' };
            if (authToken) h['Authorization'] = 'Bearer ' + authToken;
            return h;
        }

        // ==================== 数据缓存 ====================
        function getCachedItems() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const { data, timestamp } = JSON.parse(raw);
                if (Date.now() - timestamp > CACHE_TTL) return null;
                return data;
            } catch (e) {
                return null;
            }
        }

        function setCachedItems(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    data,
                    timestamp: Date.now()
                }));
            } catch (e) { }
        }

        function clearCache() {
            try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
        }

        // ==================== API 调用 ====================
        async function loadItems(useCache = true) {
            // 管理员不用缓存，直接拉最新
            if (!isAdmin && useCache) {
                const cached = getCachedItems();
                if (cached) {
                    items = cached;
                    render();
                    // 后台静默刷新
                    fetchFreshItems();
                    return;
                }
            }

            await fetchFreshItems();
        }

        async function fetchFreshItems() {
            try {
                const url = isAdmin ? `${API_BASE}/items?all=1` : `${API_BASE}/items`;
                const res = await fetch(url, { headers: authHeaders() });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const rows = await res.json();
                items = rows.map(r => ({
                    id: r.id,
                    original: r.original,
                    translated: r.translated,
                    author: r.author,
                    authorLink: r.author_link,
                    translationLink: r.translation_link,
                    originalLink: r.original_link,
                    description: r.description,
                    status: r.status,
                    category: r.category || 'addon',   // ⭐
                    expanded: false
                }));
                if (!isAdmin) setCachedItems(items);
            } catch (e) {
                console.error('加载失败', e);
                if (items.length === 0) {
                    showToast('加载数据失败，请刷新重试');
                }
            }
        }

        async function apiCreate(item) {
            const res = await fetch(`${API_BASE}/items`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify(item)
            });
            if (!res.ok) throw new Error('创建失败');
            clearCache();
            return res.json();
        }

        async function apiUpdate(id, fields) {
            const res = await fetch(`${API_BASE}/items/${id}`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify(fields)
            });
            if (!res.ok) throw new Error('更新失败');
            clearCache();
            return res.json();
        }

        async function apiDelete(id) {
            const res = await fetch(`${API_BASE}/items/${id}`, {
                method: 'DELETE',
                headers: authHeaders()
            });
            if (!res.ok) throw new Error('删除失败');
            clearCache();
        }

        async function apiBatchCreate(list) {
            const res = await fetch(`${API_BASE}/items/batch`, {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify(list)
            });
            if (!res.ok) throw new Error('批量导入失败');
            clearCache();
            return res.json();
        }

        async function apiReorder(list) {
            const res = await fetch(`${API_BASE}/items/reorder`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify(list)
            });
            if (!res.ok) throw new Error('排序失败');
            clearCache();
            return res.json();
        }

        async function apiBatchUpdate(list) {
            const res = await fetch(`${API_BASE}/items/batch-update`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify(list)
            });
            if (!res.ok) throw new Error('批量更新失败');
            clearCache();
            return res.json();
        }

        // ==================== 公告轮播 ====================
        let announcementList = [];
        let announcementIndex = 0;
        let announcementTimer = null;
        let announcementRafId = null;

        async function fetchAnnouncement() {
            try {
                const res = await fetch(`${API_BASE}/settings/announcement`);
                const data = await res.json();
                const raw = (data.value || '欢迎来到天际译栈！').toString();
                announcementList = raw.split(/\n/).map(s => s.trim()).filter(s => s.length > 0);
                if (announcementList.length === 0) {
                    announcementList = ['欢迎来到天际译栈！'];
                }
            } catch (e) {
                announcementList = ['欢迎来到天际译栈！'];
            }
            renderAnnouncement();
            startAnnouncementRotate();
        }

        function renderAnnouncement() {
            const track = document.getElementById('announcementTrack');
            if (!track) return;

            // 末尾复制第一条，实现 A-B-C-A 无缝循环
            const list = announcementList.length > 1
                ? [...announcementList, announcementList[0]]
                : [...announcementList];

            track.innerHTML = list
                .map(text => `<div class="announcement-text"><span>${escapeHtml(text)}</span></div>`)
                .join('');

            announcementIndex = 0;
            resetTrackPosition();
            requestAnimationFrame(() => {
                checkAnnouncementOverflow();
            });
        }

        function resetTrackPosition() {
            const track = document.getElementById('announcementTrack');
            if (!track) return;
            track.style.transition = 'none';
            track.style.transform = 'translateY(0)';
            void track.offsetHeight;
            track.style.transition = '';
        }

        function checkAnnouncementOverflow() {
            const viewport = document.getElementById('announcementViewport');
            const items = document.querySelectorAll('#announcementTrack .announcement-text');
            if (!viewport || !items.length) return;

            // 视口宽度要扣掉右侧编辑/关闭按钮宽度（约 40px）
            const reservedRight = 44;
            const viewportWidth = viewport.clientWidth - reservedRight;

            items.forEach(el => {
                const span = el.querySelector('span');
                if (!span) return;
                el.classList.remove('scrolling');
                el.dataset.overflow = '0';
                // 量实际宽度
                const textWidth = span.scrollWidth;
                if (textWidth > viewportWidth) {
                    el.dataset.overflow = '1';
                    el.dataset.textWidth = textWidth;
                }
            });
        }

        // 单条公告展示：停顿 → 滚动 → 停顿 → 下一条
        function playAnnouncement(index) {
            const track = document.getElementById('announcementTrack');
            if (!track) return;
            const items = track.querySelectorAll('.announcement-text');
            if (!items.length) return;

            // 先把当前条目滚到对应位置
            const lineHeight = items[0].offsetHeight || 21;
            track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            track.style.transform = `translateY(-${index * lineHeight}px)`;

            const el = items[index];
            if (!el) return;
            const span = el.querySelector('span');
            if (!span) return;

            // 重置 span 位置
            span.style.transition = 'none';
            span.style.transform = 'translateX(0)';
            void span.offsetHeight;

            const isOverflow = el.dataset.overflow === '1';

            // 停顿 2 秒
            announcementTimer = setTimeout(() => {
                if (!isOverflow) {
                    // 不超长，直接进下一条
                    nextAnnouncement(index);
                    return;
                }

                // 超长：滚动
                const viewport = document.getElementById('announcementViewport');
                const reservedRight = 44;
                const visibleWidth = viewport.clientWidth - reservedRight;
                const textWidth = span.scrollWidth;
                const scrollDistance = textWidth - visibleWidth;

                if (scrollDistance <= 0) {
                    nextAnnouncement(index);
                    return;
                }

                // 滚动速度：35 px/秒（可根据需要调整，数值越小越慢）
                const SPEED = 35;
                const duration = (scrollDistance / SPEED) * 1000;

                span.style.transition = `transform ${duration}ms linear`;
                span.style.transform = `translateX(-${scrollDistance}px)`;

                // 滚动结束后等待 2 秒，切下一条
                announcementTimer = setTimeout(() => {
                    nextAnnouncement(index);
                }, duration + 2000);
            }, 6000);
        }

        function nextAnnouncement(currentIndex) {
            const next = currentIndex + 1;
            const track = document.getElementById('announcementTrack');
            if (!track) return;
            const items = track.querySelectorAll('.announcement-text');
            if (!items.length) return;

            const lineHeight = items[0].offsetHeight || 21;

            if (next >= announcementList.length) {
                // 到达假 A：先平滑滚过去
                track.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                track.style.transform = `translateY(-${next * lineHeight}px)`;

                // 动画结束后无动画重置回真 A
                setTimeout(() => {
                    track.style.transition = 'none';
                    track.style.transform = 'translateY(0)';
                    void track.offsetHeight;

                    document.querySelectorAll('#announcementTrack .announcement-text > span').forEach(sp => {
                        sp.style.transition = 'none';
                        sp.style.transform = 'translateX(0)';
                    });

                    setTimeout(() => {
                        playAnnouncement(0);
                    }, 150);
                }, 520);
            } else {
                playAnnouncement(next);
            }
        }

        function startAnnouncementRotate() {
            if (announcementTimer) clearTimeout(announcementTimer);
            if (announcementRafId) cancelAnimationFrame(announcementRafId);
            if (announcementList.length === 0) return;

            // 延迟一点等 DOM 就绪
            setTimeout(() => {
                playAnnouncement(0);
            }, 200);
        }

        async function saveAnnouncement(value) {
            const res = await fetch(`${API_BASE}/settings/announcement`, {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify({ value })
            });
            if (!res.ok) throw new Error('保存失败');
            return res.json();
        }

        // ==================== 渲染 ====================
        function filterItems(list) {
            if (!searchQuery) return list;
            const q = searchQuery.toLowerCase();
            return list.filter(item => {
                const orig = (item.original || '').toLowerCase();
                const trans = (item.translated || '').toLowerCase();
                const author = (item.author || '').toLowerCase();
                const desc = (item.description || '').toLowerCase();
                return orig.includes(q) || trans.includes(q) || author.includes(q) || desc.includes(q);
            });
        }

        function filterDoneItems(list) {
            let result = list;
            // 先按分类筛选
            if (currentCategory && currentCategory !== 'all') {
                result = result.filter(item => (item.category || 'addon') === currentCategory);
            }
            // 再按搜索关键词筛选
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                result = result.filter(item => {
                    const orig = (item.original || '').toLowerCase();
                    const trans = (item.translated || '').toLowerCase();
                    const author = (item.author || '').toLowerCase();
                    const desc = (item.description || '').toLowerCase();
                    return orig.includes(q) || trans.includes(q) || author.includes(q) || desc.includes(q);
                });
            }
            return result;
        }

        function render() {
            const allPending = items.filter(i => i.status !== STATUS.DONE);
            const doing = allPending.filter(i => i.status === STATUS.DOING);
            const todo = allPending.filter(i => i.status !== STATUS.DOING);
            const sortedPending = [...doing, ...todo];

            const allDone = items.filter(i => i.status === STATUS.DONE);

            const filteredPending = filterItems(sortedPending);       // 待汉化：只搜索
            const filteredDone = filterDoneItems(allDone);             // 已汉化：搜索 + 分类

            document.getElementById('pendingCount').textContent = allPending.length;
            document.getElementById('doneCount').textContent = allDone.length;

            // 访客看不到待汉化模块
            document.getElementById('pendingModule').style.display = isAdmin ? '' : 'none';

            renderList('pendingList', filteredPending, false);
            renderList('doneList', filteredDone, true);

            updateModuleStyles();
        }

        function updateModuleStyles() {
            const pendingModule = document.getElementById('pendingModule');
            const doneModule = document.getElementById('doneModule');
            const pendingToggle = document.getElementById('pendingToggle');
            const doneToggle = document.getElementById('doneToggle');

            // 处理待汉化模块
            handleModuleToggle(pendingModule, pendingToggle, moduleExpanded.pending);
            // 处理已汉化模块
            handleModuleToggle(doneModule, doneToggle, moduleExpanded.done);
        }

        function handleModuleToggle(moduleEl, toggleBtn, expanded) {
            const bodyEl = moduleEl.querySelector('.module-body');
            if (!bodyEl) return;

            if (expanded) {
                // 展开
                moduleEl.classList.add('module-expanded');
                toggleBtn.textContent = '▲';
                // 先量一下真实高度，赋给它作为动画终点
                const targetHeight = bodyEl.scrollHeight;
                bodyEl.style.maxHeight = targetHeight + 'px';
                // 动画结束后让它自适应
                clearTimeout(bodyEl._expandTimer);
                bodyEl._expandTimer = setTimeout(() => {
                    if (moduleEl.classList.contains('module-expanded')) {
                        bodyEl.style.maxHeight = 'none';
                    }
                }, 370);
            } else {
                // 收起
                // 如果当前是 none，先恢复成具体高度才能过渡
                if (bodyEl.style.maxHeight === 'none') {
                    bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
                    void bodyEl.offsetHeight;
                }
                moduleEl.classList.remove('module-expanded');
                toggleBtn.textContent = '▼';
                // 移除 inline style，让 CSS 的 260px 生效
                bodyEl.style.maxHeight = '';
            }
        }

        function renderList(containerId, list, isDoneSection) {
            const container = document.getElementById(containerId);
            if (!list.length) {
                let msg = searchQuery ? '没有匹配的搜索结果' : (isDoneSection ? '暂无已汉化项目' : '还没有项目');
                container.innerHTML = `<div class="empty-msg">${msg}</div>`;
                return;
            }

            let html = '';
            list.forEach(item => {
                const orig = item.original || '未知';
                const trans = item.translated || '';
                const authorDisplay = item.author || '佚名';
                const status = item.status || STATUS.TODO;
                const isDone = status === STATUS.DONE;
                const isDoing = status === STATUS.DOING;
                const expanded = item.expanded ? 'show' : '';

                let nameHtml = '';
                if (isDone && trans) {
                    nameHtml = `<span class="orig">${escapeHtml(orig)}</span> <span class="trans">(${escapeHtml(trans)})</span>`;
                } else if (isDone && !trans) {
                    nameHtml = `<span class="orig">${escapeHtml(orig)}</span> <span class="trans">(未填写中译名)</span>`;
                } else {
                    nameHtml = `<span class="orig">${escapeHtml(orig)}</span>`;
                }

                let iconClass = '';
                let iconContent = '';
                if (isDone) {
                    iconClass = 'done';
                    iconContent = '✅';
                } else if (isDoing) {
                    iconClass = 'in-progress';
                    iconContent = '⏳';
                } else {
                    iconClass = '';
                    iconContent = '□';
                }


                html += `
                    <div class="item" data-id="${item.id}">
                        <div class="item-top">
                            ${isAdmin ? `<span class="drag-handle" draggable="true" data-id="${item.id}" title="拖动排序">⋮⋮</span>` : ''}
                            ${!isDone ? `<span class="status-icon ${iconClass}" data-action="cycle-status" data-id="${item.id}" title="点击切换状态">${iconContent}</span>` : ''}
                            <div class="item-name">${nameHtml}</div>
                        </div>
                        <div class="item-bottom">
                            <span class="author-name">${escapeHtml(authorDisplay)}</span>
                            ${isAdmin ? `<button class="edit-icon-btn" data-action="edit-item" data-id="${item.id}" title="编辑">✏️</button>` : ''}
                            <button class="expand-btn" data-action="expand" data-id="${item.id}">${item.expanded ? '▲' : '▼'}</button>
                        </div>
                        <div class="item-details" data-details-id="${item.id}"></div>
                    </div>
                `;

            container.innerHTML = html;
        }

        function buildDetailsHtml(item) {
            const isDone = item.status === STATUS.DONE;
            let detailsHtml = '';

            if (item.description) {
                detailsHtml += `<div class="item-description">${escapeHtml(item.description)}</div>`;
            }

            const linkFields = isDone
                ? [
                    { label: '作者直链', field: 'authorLink' },
                    { label: '汉化链接', field: 'translationLink' },
                    { label: '原版链接', field: 'originalLink' }
                ]
                : [{ label: '原版链接', field: 'originalLink' }];

            linkFields.forEach(({ label, field }) => {
                const val = item[field] || '';
                const readonlyHtml = isAdmin
                    ? `<input type="text" class="detail-input" data-field="${field}" data-id="${item.id}" value="${escapeHtml(val)}" placeholder="https://...">`
                    : `<div class="detail-readonly">${val ? escapeHtml(val) : '<span style="color:var(--text-light);">未填写</span>'}</div>`;
                detailsHtml += `
            <div class="detail-row">
                <span class="detail-label">${label}</span>
                ${readonlyHtml}
                <div class="btn-group">
                    <button class="copy-btn" data-copy="${field}" data-id="${item.id}">📋 复制</button>
                    <a class="open-btn" href="javascript:void(0)" data-action="open-link" data-id="${item.id}" data-field="${field}">🔗 跳转</a>
                </div>
            </div>
        `;
            });

            return detailsHtml;
        }

        // ==================== 操作 ====================
        async function cycleStatus(id) {
            if (!isAdmin) return;
            const item = items.find(i => i.id === id);
            if (!item) return;
            const current = item.status || STATUS.TODO;

            let newStatus;
            if (current === STATUS.TODO) newStatus = STATUS.DOING;
            else if (current === STATUS.DOING) newStatus = STATUS.DONE;
            else newStatus = STATUS.TODO;

            try {
                await apiUpdate(id, { status: newStatus });
                item.status = newStatus;

                // 重置详情状态（因为状态变了，详情内容可能不一样，需要重新注入）
                const itemEl = document.querySelector(`.item[data-id="${id}"]`);
                if (itemEl) {
                    const detailsEl = itemEl.querySelector('.item-details');
                    if (detailsEl) {
                        detailsEl.classList.remove('show');
                        detailsEl.style.maxHeight = '';
                        detailsEl.innerHTML = '';
                        delete detailsEl.dataset.loaded;
                        clearTimeout(detailsEl._expandTimer);
                        clearTimeout(detailsEl._collapseTimer);
                    }
                }
                item.expanded = false;

                render();

                // 如果变成已汉化但没中译名，自动展开编辑弹窗
                if (newStatus === STATUS.DONE && !item.translated) {
                    setTimeout(() => openEditModal(id), 100);
                }
            } catch (e) {
                showToast('操作失败');
            }
        }

        function toggleExpand(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const itemEl = document.querySelector(`.item[data-id="${id}"]`);
            if (!itemEl) return;
            const detailsEl = itemEl.querySelector('.item-details');
            if (!detailsEl) return;

            const isOpening = !item.expanded;
            item.expanded = isOpening;

            if (isOpening) {
                // 1. 先注入内容（如果还没注入过）
                if (!detailsEl.dataset.loaded) {
                    detailsEl.innerHTML = buildDetailsHtml(item);
                    detailsEl.dataset.loaded = '1';
                }
                // 2. 触发动画：先让 max-height 有值，再在下一帧加 .show
                detailsEl.classList.remove('show');
                // 强制 reflow，确保 transition 能触发
                void detailsEl.offsetHeight;
                detailsEl.classList.add('show');

                // 3. 动画结束后把 max-height 设为 none，让内容自适应（避免超高内容被截断）
                clearTimeout(detailsEl._expandTimer);
                detailsEl._expandTimer = setTimeout(() => {
                    if (detailsEl.classList.contains('show')) {
                        detailsEl.style.maxHeight = 'none';
                    }
                }, 350);
            } else {
                // 收起：先把 max-height 从 none 恢复成具体值，才能过渡
                if (detailsEl.style.maxHeight === 'none') {
                    detailsEl.style.maxHeight = detailsEl.scrollHeight + 'px';
                    // 强制 reflow
                    void detailsEl.offsetHeight;
                }
                detailsEl.style.maxHeight = '';
                detailsEl.classList.remove('show');

                // 收起动画结束后，可以清空内容释放 DOM（可选）
                clearTimeout(detailsEl._collapseTimer);
                detailsEl._collapseTimer = setTimeout(() => {
                    if (!detailsEl.classList.contains('show')) {
                        // 保留 dataset.loaded 状态，避免再次展开时重复注入
                        // 如果想进一步省内存，这里可以清空 innerHTML 并删掉 data-loaded
                    }
                }, 350);
            }
        }

        async function deleteFromModal() {
            if (!editingItemId) return;
            const item = items.find(i => i.id === editingItemId);
            if (!item) return;
            if (!confirm(`确定要移除「${item.original}」吗？`)) return;

                items = items.filter(i => i.id !== editingItemId);
