<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>天际译栈 - 我的世界基岩版附加包汉化分享</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
    <!-- SEO -->
    <meta name="description" content="天际译栈是栈主整理的 Minecraft 基岩版附加包汉化列表，包含光影、材质包、地图、附加包等资源。">
    <meta name="keywords" content="我的世界,基岩版,附加包,汉化,光影,材质包,地图,Minecraft">
    <meta name="author" content="栈主">
    <!-- 防暗黑模式闪烁 -->
    <script>
        (function () {
            try {
                const t = localStorage.getItem('tianji_theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <style>
        /* ==================== 主题变量 ==================== */
        :root {
            --bg-page: #f5f7fb;
            --bg-card: #ffffff;
            --bg-module: #fafdff;
            --bg-header: #f0f6fd;
            --bg-input: #ffffff;
            --bg-search: #f9fcff;
            --bg-hover: #e9f0f8;
            --bg-tag: #ecf3fa;
            --text-main: #1e2b3a;
            --text-title: #2c3e50;
            --text-sub: #4f6b84;
            --text-muted: #6d8aa8;
            --text-light: #8fa2b5;
            --text-item: #1c2e40;
            --text-orig: #1e3d5e;
            --text-trans: #426c8a;
            --border: #e2e9f0;
            --border-light: #eef2f6;
            --border-input: #ccdceb;
            --border-soft: #e8eef5;
            --accent: #1e4d6b;
            --accent-hover: #123a52;
            --accent-light: #dbeafe;
            --accent-text: #1d4e7a;
            --accent-border: #c2daf5;
            --shadow: 0 20px 40px -10px rgba(0, 20, 40, 0.15);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.02);
            --scrollbar-track: #eef2f6;
            --scrollbar-thumb: #bdd3e6;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
            --danger-bg-hover: #fecaca;
            --announce-bg: linear-gradient(90deg, #e0f2fe, #f0f9ff);
            --announce-border: #bae6fd;
            --announce-text: #075985;
        }

        [data-theme="dark"] {
            --bg-page: #0f1218;
            --bg-card: #181c24;
            --bg-module: #1a1f28;
            --bg-header: #232936;
            --bg-input: #232936;
            --bg-search: #1e242e;
            --bg-hover: #2a3240;
            --bg-tag: #252c38;
            --text-main: #e4e9f0;
            --text-title: #d8dfe8;
            --text-sub: #a8b5c4;
            --text-muted: #8894a4;
            --text-light: #78859a;
            --text-item: #dde4ec;
            --text-orig: #e8eef5;
            --text-trans: #9ab4cc;
            --border: #2a313c;
            --border-light: #232830;
            --border-input: #333b48;
            --border-soft: #262c36;
            --accent: #3b7a9e;
            --accent-hover: #4a8fb5;
            --accent-light: #2a3a4a;
            --accent-text: #9bc4e0;
            --accent-border: #34506a;
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            --shadow-soft: 0 2px 6px rgba(0, 0, 0, 0.2);
            --scrollbar-track: #232830;
            --scrollbar-thumb: #3a4351;
            --danger-bg: #3d1f22;
            --danger-text: #f0a8a8;
            --danger-bg-hover: #4a2529;
            --announce-bg: linear-gradient(90deg, #1e3a5f, #1e293b);
            --announce-border: #334155;
            --announce-text: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-page);
            color: var(--text-main);
            padding: 5rem 1rem 2rem;
            /* 顶部从 2rem 改成 5rem，留出导航栏高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .app {
            max-width: 900px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 1.5rem 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }


        /* ==================== 公告栏 ==================== */
        .announcement {
            background: var(--announce-bg);
            border: 1px solid var(--announce-border);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--announce-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            line-height: 1.5;
        }

        .announcement-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .announcement-viewport {
            flex: 1;
            overflow: hidden;
            height: 1.5em;
            /* 单行高度 */
            position: relative;
        }

        .announcement-track {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .announcement-track .announcement-text {
            height: 1.5em;
            line-height: 1.5;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        /* 文字内容包一层，用于滚动 */
        .announcement-track .announcement-text>span {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        /* 只有当内容宽度超出容器时才添加滚动动画 */
        .announcement-track .announcement-text.scrolling>span {
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .announcement-close {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0.5;
            cursor: pointer;
            font-size: 1rem;
            padding: 0 0.2rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .announcement-close:hover {
            opacity: 1;
        }

        .announcement-edit {
            background: transparent;
            border: none;
            color: inherit;
            opacity: 0.6;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 0.2rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .announcement-edit:hover {
            opacity: 1;
        }

        .top-bar {
            flex-shrink: 0;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .top-left {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .sponsor-btn {
            background: #ffe9c7;
            border: none;
            border-radius: 60px;
            padding: 0.7rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #a05e1a;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 180, 80, 0.2);
            transition: all 0.2s ease;
            border: 1px solid #ffd9a3;
        }

        .sponsor-btn:hover {
            background: #ffddb0;
            transform: scale(1.02);
        }

        .login-btn {
            background: var(--bg-tag);
            border: 1px solid var(--accent-border);
            border-radius: 60px;
            padding: 0.7rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--accent-text);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: var(--bg-hover);
        }

        .login-btn.admin {
            background: #d1fae5;
            border-color: #6ee7b7;
            color: #065f46;
        }

        .bili-btn {
            background: #ffe6f0;
            border: 1px solid #ffb3d1;
            border-radius: 60px;
            padding: 0.7rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #d63384;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .bili-btn:hover {
            background: #ffd0e0;
        }

        /* 主题切换按钮 */
        .theme-btn {
            background: var(--bg-tag);
            border: 1px solid var(--border);
            border-radius: 60px;
            width: 40px;
            height: 40px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-main);
        }

        .theme-btn:hover {
            background: var(--bg-hover);
        }

        .modules-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .module {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            background: var(--bg-module);
            overflow: hidden;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .module-body {
            max-height: 260px;
            overflow-y: auto;
            transition:
                max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .module.module-expanded .module-body {
            max-height: 5000px;
            overflow-y: auto;
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.9rem;
            background: var(--bg-header);
            cursor: default;
            flex-shrink: 0;
            user-select: none;
            transition: background 0.2s;
        }

        .module-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            white-space: nowrap;
        }

        .module-title .emoji {
            font-size: 1rem;
            line-height: 1;
        }

        .module-title .badge {
            background: var(--accent-light);
            color: var(--accent-text);
            font-size: 0.7rem;
            border-radius: 30px;
            padding: 0.05rem 0.55rem;
            font-weight: 500;
        }

        .module-toggle {
            background: transparent;
            border: none;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 30px;
            transition: 0.15s;
            line-height: 1;
        }

        .module-toggle:hover {
            background: var(--bg-hover);
        }

        .module-body {
            flex: 1;
            padding: 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            scrollbar-width: thin;
            min-height: 0;
        }

        .module-body::-webkit-scrollbar {
            width: 8px;
        }

        .module-body::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 20px;
        }

        .module-body::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 20px;
        }

        .bottom-bar {
            flex-shrink: 0;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .bottom-left {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .bottom-right {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent-light);
            border: none;
            padding: 0.7rem 1.3rem;
            border-radius: 40px;
            font-weight: 500;
            color: var(--accent-text);
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .btn-danger:hover {
            background: var(--danger-bg-hover);
        }

        .item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-soft);
            transition: all 0.15s;
        }

        .item:hover {
            border-color: var(--scrollbar-thumb);
        }

        .item-top {
            display: flex;
            align-items: flex-start;
            padding: 0.6rem 0.9rem 0.3rem 0.9rem;
            gap: 0.5rem;
        }

        .status-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            font-size: 0.88rem;
            line-height: 1;
            transition: 0.15s;
            width: 22px;
            height: 22px;
            color: var(--text-muted);
            border-radius: 4px;
            margin-top: 1px;
        }

        .status-icon:hover {
            background: var(--bg-hover);
        }

        .status-icon.done {
            color: #2e7d32;
        }

        .status-icon.in-progress {
            color: #b45309;
        }

        .item-name {
            flex: 1;
            font-weight: 500;
            color: var(--text-item);
            min-width: 0;
            word-break: break-word;
            font-size: 0.88rem;
            line-height: 1.5;
            padding-top: 1px;
        }

        .item-name .orig {
            font-weight: 600;
            color: var(--text-orig);
        }

        .item-name .trans {
            color: var(--text-trans);
            font-weight: 400;
            margin-left: 0.1rem;
        }

        .item-bottom {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 0.9rem 0.6rem 0.9rem;
            gap: 0.5rem;
        }

        .author-name {
            font-size: 0.82rem;
            color: var(--text-sub);
            background: var(--bg-tag);
            padding: 0.2rem 0.75rem;
            border-radius: 40px;
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .edit-icon-btn {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            color: var(--text-light);
            cursor: pointer;
            padding: 0.2rem 0.3rem;
            border-radius: 30px;
            transition: 0.15s;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .edit-icon-btn:hover {
            background: var(--bg-hover);
            color: var(--text-sub);
        }

        .expand-btn {
            background: transparent;
            border: none;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 30px;
            transition: 0.15s;
            line-height: 1;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .expand-btn:hover {
            background: var(--bg-hover);
        }

        .item-details {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            padding: 0 0.9rem;
            margin-top: 0;
            background: var(--bg-module);
            border-radius: 0 0 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            border-top: 1px dashed transparent;
            transition:
                max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.22s ease,
                padding 0.32s cubic-bezier(0.4, 0, 0.2, 1),
                margin-top 0.32s ease,
                border-top-color 0.32s ease;
        }

        .item-details.show {
            max-height: 3000px;
            /* 上限，够用即可；动画结束后由 JS 置为 none */
            opacity: 1;
            padding: 0.7rem 0.9rem 1rem 0.9rem;
            margin-top: 0.2rem;
            border-top-color: var(--border-input);
        }

        .item-description {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.6;
            padding: 0.2rem 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            width: 65px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .detail-input {
            flex: 1;
            min-width: 160px;
            padding: 0.45rem 0.7rem;
            border: 1px solid var(--border-input);
            border-radius: 10px;
            font-size: 0.85rem;
            background: var(--bg-input);
            color: var(--text-main);
            transition: 0.15s;
        }

        .detail-input:focus {
            outline: 2px solid var(--accent-border);
            border-color: transparent;
        }

        .detail-readonly {
            flex: 1;
            min-width: 160px;
            font-size: 0.85rem;
            color: var(--text-main);
            word-break: break-all;
            padding: 0.45rem 0;
        }

        .btn-group {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .copy-btn,
        .open-btn {
            background: var(--bg-tag);
            border: none;
            border-radius: 10px;
            padding: 0.45rem 0.7rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent-text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            transition: 0.1s;
            white-space: nowrap;
            flex-shrink: 0;
            text-decoration: none;
        }

        .copy-btn:hover,
        .open-btn:hover {
            background: var(--bg-hover);
        }

        .empty-msg {
            color: var(--text-light);
            font-size: 0.88rem;
            padding: 0.8rem 0.5rem;
            font-style: italic;
        }

        .loading {
            color: var(--text-light);
            font-size: 0.9rem;
            padding: 1rem;
            text-align: center;
        }

        /* 骨架屏 */
        .skeleton-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 0.8rem 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, var(--border-light) 25%, var(--border) 50%, var(--border-light) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .hidden-file-input {
            display: none;
        }

        .trans-input {
            background: var(--bg-input);
            border: 1px solid #fcd34d;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 2rem 2rem 1.8rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-card h3 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .modal-field {
            margin-bottom: 1rem;
        }

        .modal-field label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        .modal-field input,
        .modal-field textarea {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border-input);
            border-radius: 12px;
            font-size: 0.9rem;
            background: var(--bg-input);
            color: var(--text-main);
            transition: 0.15s;
            font-family: inherit;
        }

        .modal-field input:focus,
        .modal-field textarea:focus {
            outline: 2px solid var(--accent-border);
            border-color: transparent;
        }

        .modal-field textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 0.6rem;

</head>

        (function () {
            // ==================== 配置 ====================
            const API_BASE = 'https://tianji-server-production-d7f3.up.railway.app/api';
            const TOKEN_KEY = 'tianji_token';
            const QR_KEY = 'tianji_qr_image';
            const THEME_KEY = 'tianji_theme';
            const CACHE_KEY = 'tianji_items_cache';
            const CACHE_TTL = 5 * 60 * 1000; // 5 分钟

            // ==================== 状态 ====================
            let items = [];
            let qrImageSrc = localStorage.getItem(QR_KEY) || '';
            let searchQuery = '';
            let authToken = localStorage.getItem(TOKEN_KEY) || '';
            let isAdmin = false;
            let currentUsername = localStorage.getItem('tianji_username') || '';   // ← 加这里
            let editingItemId = null;

            const moduleExpanded = {
                pending: false,
                done: false
            };

            const STATUS = {
                TODO: 'todo',
                DOING: 'doing',
                DONE: 'done'
            };

            // ==================== 主题切换 ====================
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const btn = document.getElementById('themeToggleBtn');
                if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) { }
            }

            // ==================== 工具函数 ====================
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function showToast(text) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = text;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1500);
            }

            // ==================== 外部链接风险提醒 ====================
            function showExternalWarning(url, onConfirm) {
                const modal = document.getElementById('externalWarningModal');
                const urlInput = document.getElementById('externalWarningUrl');
                const confirmBtn = document.getElementById('externalWarningConfirm');
                const cancelBtn = document.getElementById('externalWarningCancel');
                const copyBtn = document.getElementById('externalWarningCopy');

                urlInput.value = url;
                modal.classList.add('show');

                // 用 cloneNode 替换，清掉旧的事件监听，避免多次绑定
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                newConfirm.addEventListener('click', () => {
                    modal.classList.remove('show');
                    if (onConfirm) onConfirm();
                });

                const newCancel = cancelBtn.cloneNode(true);
                cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
                newCancel.addEventListener('click', () => {
                    modal.classList.remove('show');
                });

                const newCopy = copyBtn.cloneNode(true);
                copyBtn.parentNode.replaceChild(newCopy, copyBtn);
                newCopy.addEventListener('click', () => {
                    copyText(url);
                });

                modal.onclick = (e) => {
                    if (e.target === modal) modal.classList.remove('show');
                };
            }

            function hasChinese(text) {
                return /[\u4e00-\u9fa5]/.test(text);
            }

            function authHeaders() {
                const h = { 'Content-Type': 'application/json' };
                if (authToken) h['Authorization'] = 'Bearer ' + authToken;
                return h;
            }

            // ==================== 数据缓存 ====================
            function getCachedItems() {
                try {
                    const raw = localStorage.getItem(CACHE_KEY);
                    if (!raw) return null;
                    const { data, timestamp } = JSON.parse(raw);
                    if (Date.now() - timestamp > CACHE_TTL) return null;
                    return data;
                } catch (e) {
                    return null;
                }
            }

            function setCachedItems(data) {
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify({
                        data,
                        timestamp: Date.now()
                    }));
                } catch (e) { }
            }

            function clearCache() {
                try { localStorage.removeItem(CACHE_KEY); } catch (e) { }
            }

            // ==================== API 调用 ====================
            async function loadItems(useCache = true) {
                // 管理员不用缓存，直接拉最新
                if (!isAdmin && useCache) {
                    const cached = getCachedItems();
                    if (cached) {
                        items = cached;
                        render();
                        // 后台静默刷新
                        fetchFreshItems();
                        return;
                    }
                }

                await fetchFreshItems();
            }

            async function fetchFreshItems() {
                try {
                    const url = isAdmin ? `${API_BASE}/items?all=1` : `${API_BASE}/items`;
                    const res = await fetch(url, { headers: authHeaders() });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const rows = await res.json();
                    items = rows.map(r => ({
                        id: r.id,
                        original: r.original,
                        translated: r.translated,
                        author: r.author,
                        authorLink: r.author_link,
                        translationLink: r.translation_link,
                        originalLink: r.original_link,
                        description: r.description,
                        status: r.status,
                        expanded: false
                    }));
                    if (!isAdmin) setCachedItems(items);
                } catch (e) {
                    console.error('加载失败', e);
                    if (items.length === 0) {
                        showToast('加载数据失败，请刷新重试');
                    }
                }
            }

            async function apiCreate(item) {
                const res = await fetch(`${API_BASE}/items`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify(item)
                });
                if (!res.ok) throw new Error('创建失败');
                clearCache();
                return res.json();
            }

            async function apiUpdate(id, fields) {
                const res = await fetch(`${API_BASE}/items/${id}`, {
                    method: 'PUT',

                });
                if (!res.ok) throw new Error('更新失败');

                return res.json();

            async function apiDelete(id) {
                const res = await fetch(`${API_BASE}/items/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                if (!res.ok) throw new Error('删除失败');
